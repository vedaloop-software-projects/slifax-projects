name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - 'product-label-printing/product-label-printing-backend/**'

permissions:
  contents: read
  id-token: write

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: slifax-project
          workload_identity_provider: projects/668661293052/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@slifax-project.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Authenticate Docker
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            -t europe-west1-docker.pkg.dev/slifax-project/slifax-backend/slifax-backend:${{ github.sha }} \
            ./product-label-printing/product-label-printing-backend

      - name: Push Docker image
        run: |
          docker push \
            europe-west1-docker.pkg.dev/slifax-project/slifax-backend/slifax-backend:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy slifax-backend \
            --image=europe-west1-docker.pkg.dev/slifax-project/slifax-backend/slifax-backend:${{ github.sha }} \
            --region=europe-west1 \
            --project=slifax-project \
            --service-account=668661293052-compute@developer.gserviceaccount.com \
            --port=5000 \
            --set-env-vars="DB_PORT=4000,DB_NAME=zenxpos_dev,DB_SSL_CA=/app/certs/ca.pem,JWT_EXPIRES_IN=1d" \
            --set-secrets="DB_HOST=DB_HOST:latest,DB_USER=DB_USER:latest,DB_PASSWORD=DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest" \
            --allow-unauthenticated
