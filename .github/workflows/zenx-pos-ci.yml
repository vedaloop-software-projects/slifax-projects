name: ZenxPOS CI

on:
  pull_request:
    branches: [main, sasi-dev]
    paths:
      - 'zenx-pos/zenx-pos-backend/**'
      - 'zenx-pos/zenx-pos-superadmin/**'
      - 'zenx-pos/tools/**'
      - 'zenx-pos/Dockerfile'
      - 'zenx-pos/.dockerignore'
      - 'zenx-pos/deploy/**'
      - '.github/workflows/zenx-pos-*.yml'
  push:
    branches: [main, sasi-dev]
    paths:
      - 'zenx-pos/zenx-pos-backend/**'
      - 'zenx-pos/zenx-pos-superadmin/**'
      - 'zenx-pos/tools/**'
      - 'zenx-pos/Dockerfile'
      - 'zenx-pos/.dockerignore'
      - 'zenx-pos/deploy/**'
      - '.github/workflows/zenx-pos-*.yml'

permissions:
  contents: read

concurrency:
  group: zenx-pos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    name: Migration checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: zenx-pos/zenx-pos-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zenx-pos/zenx-pos-backend/package-lock.json
      - run: npm ci
      - name: Verify generated schema and migration parity
        run: npm run migration:check
      - name: Validate deployment migration scripts
        working-directory: zenx-pos
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n deploy/apply-migrations.sh deploy/remote-deploy.sh deploy/verify-fresh-database.sh deploy/bootstrap-production.sh deploy/export-reference-data.sh
          node --test tools/migration/baseline.test.mjs
          count=0
          while IFS= read -r migration; do
            name="${migration##*/}"
            [[ "$name" =~ ^[0-9]{8,14}_[a-z0-9_]+\.sql$ ]]
            test -s "$migration"
            count=$((count + 1))
          done < <(find deploy/sql -maxdepth 1 -type f -name '*.sql' | LC_ALL=C sort)
          test "$count" -gt 0

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zenx-pos/zenx-pos-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zenx-pos/zenx-pos-backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  superadmin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: zenx-pos/zenx-pos-superadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zenx-pos/zenx-pos-superadmin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  container:
    needs: [migrations, backend, superadmin]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: zenx-pos/zenx-pos-backend/package-lock.json
      - name: Install backend tooling for schema verification
        working-directory: zenx-pos/zenx-pos-backend
        run: npm ci
      - name: Build production image
        run: docker build --file zenx-pos/Dockerfile --tag zenx-pos:ci zenx-pos
      - name: Verify the image against a brand-new database
        working-directory: zenx-pos
        run: bash deploy/verify-fresh-database.sh zenx-pos:ci
