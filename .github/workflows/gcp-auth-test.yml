name: GCP Authentication Test

on:
  push:
    branches:
      - slifax-devops

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: slifax-project
          workload_identity_provider: projects/668661293052/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@slifax-project.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: slifax-project

      - name: Verify authentication
        run: |
          gcloud auth list
          gcloud config get-value project
