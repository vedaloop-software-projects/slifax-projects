name: zenxpos-${ZENXPOS_ENVIRONMENT:?Set ZENXPOS_ENVIRONMENT}

services:
  mysql:
    image: ${ZENXPOS_MYSQL_IMAGE:-mysql@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242}
    container_name: zenxpos-${ZENXPOS_ENVIRONMENT}-mysql
    restart: unless-stopped
    env_file:
      - mysql.env
    ports:
      - 127.0.0.1:${ZENXPOS_MYSQL_PORT:-3310}:3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-name-resolve"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    mem_limit: ${ZENXPOS_MYSQL_MEMORY_LIMIT:-4g}
    cpus: ${ZENXPOS_MYSQL_CPU_LIMIT:-2.0}

  app:
    image: ${ZENXPOS_IMAGE:?Set ZENXPOS_IMAGE to an immutable image reference}
    container_name: zenxpos-${ZENXPOS_ENVIRONMENT}
    restart: unless-stopped
    init: true
    read_only: true
    pull_policy: always
    env_file:
      - app.env
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5100
      UPLOAD_ROOT: /app/public
    ports:
      - 127.0.0.1:${ZENXPOS_PORT:?Set ZENXPOS_PORT}:5100
    volumes:
      - uploads:/app/public/uploads
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5100/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    mem_limit: ${ZENXPOS_MEMORY_LIMIT:-2g}
    cpus: ${ZENXPOS_CPU_LIMIT:-2.0}

volumes:
  mysql-data:
    name: zenxpos_${ZENXPOS_ENVIRONMENT}_mysql
  uploads:
    name: zenxpos_${ZENXPOS_ENVIRONMENT}_uploads
