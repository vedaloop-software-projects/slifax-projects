name: zenxpos-${ZENXPOS_ENVIRONMENT:?Set ZENXPOS_ENVIRONMENT}

services:
  app:
    image: ${ZENXPOS_IMAGE:?Set ZENXPOS_IMAGE to an immutable image reference}
    container_name: zenxpos-${ZENXPOS_ENVIRONMENT}
    restart: unless-stopped
    init: true
    read_only: true
    pull_policy: always
    env_file:
      - app.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5100
      UPLOAD_ROOT: /app/public
    ports:
      - 127.0.0.1:${ZENXPOS_PORT:?Set ZENXPOS_PORT}:5100
    volumes:
      - uploads:/app/public/uploads
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5100/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    mem_limit: ${ZENXPOS_MEMORY_LIMIT:-2g}
    cpus: ${ZENXPOS_CPU_LIMIT:-2.0}

volumes:
  uploads:
    name: zenxpos_${ZENXPOS_ENVIRONMENT}_uploads
