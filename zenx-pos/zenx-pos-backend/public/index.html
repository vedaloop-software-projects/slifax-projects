<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ZenxPOS API</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#17233d;background:#f3f6fc}body{margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(520px,calc(100% - 48px));padding:40px;border:1px solid #dbe3f1;border-radius:20px;background:#fff;box-shadow:0 18px 55px #1b3b7217}.brand{font-size:32px;font-weight:800;letter-spacing:-1px}.brand span{color:#2875ef}h1{font-size:22px;margin:28px 0 8px}p{line-height:1.6;color:#5b6b86}.status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:#eaf8ef;color:#18723a;font-weight:650}.dot{width:9px;height:9px;border-radius:50%;background:#28a95b}a{color:#216be0}@media(prefers-color-scheme:dark){:root{color:#eaf0ff;background:#0f192c}.card{background:#14223b;border-color:#263a5d}.brand{color:#fff}p{color:#aebbd1}.status{background:#143c29;color:#7ee2a5}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">Zenx<span>POS</span></div>
    <h1>Backend service</h1>
    <p>The ZenxPOS Node.js API is installed. Applications should use the authenticated API routes.</p>
    <div class="status"><span class="dot"></span>Service endpoint available</div>
    <p><a href="/api/health">Health status</a></p>
  </main>
</body>
</html>
